<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Задачи</h1>
        <p class="subtitle">Task Tracker</p>

        <form id="task-form">
            <input type="text" id="task-title" placeholder="Что нужно сделать?" required>
            <button type="submit">Добавить</button>
        </form>

        <ul id="task-list"></ul>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
